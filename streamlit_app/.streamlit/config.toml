[theme]
primaryColor = "#1F4E78"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#333333"
font = "sans serif"

[server]
headless = true
runOnSave = false
port = 8501
enableCORS = false
enableXsrfProtection = false
enableStaticServing = true
maxUploadSize = 200

[browser]
gatherUsageStats = false
