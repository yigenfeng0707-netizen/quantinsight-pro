# /etc/nginx/conf.d/quantinsight.conf
# HTTP: ACME + redirect HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name quantinsight.cn www.quantinsight.cn 47.76.46.88 _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> Streamlit
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name quantinsight.cn www.quantinsight.cn 47.76.46.88;

    ssl_certificate     /etc/nginx/ssl/www.quantinsight.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/www.quantinsight.cn.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
